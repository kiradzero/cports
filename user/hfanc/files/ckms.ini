; CKMS_MAKE_ARGS already carries -C <kernel>, M=<source>, LLVM=1 and the
; `modules` target, so the hook adds nothing but parallelism. LLVM=1 is what
; Chimera's clang-built kernels need, and the Makefile sets it too.

[general]
name = honor_ec_fan
version = @VERSION@
strip = yes

[hooks]
build = ${MAKE} ${CKMS_MAKE_ARGS} -j${CKMS_JOBS}

[module.honor_ec_fan]
path = .
dest = extra
