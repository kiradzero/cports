; CKMS_MAKE_ARGS only carries compiler options. Point the module Makefile at
; the headers selected by `ckms -k`; otherwise its uname-based default builds
; for the currently running kernel during an upgrade.

[general]
name = honor_ec_fan
version = @VERSION@
strip = yes

[hooks]
build = ${MAKE} ${CKMS_MAKE_ARGS} KDIR=${CKMS_KERNEL_HDRDIR} -j${CKMS_JOBS}

[module.honor_ec_fan]
path = .
dest = extra
